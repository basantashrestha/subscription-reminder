name: Docker Build & Trivy Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  # Bump this when you want a newer Trivy. Pinning it means every run
  # scans with the exact same tool version until you deliberately change it.
  TRIVY_VERSION: "0.74.0"

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      # The one action we keep here: it just fetches your repo's code
      # onto the runner. There's no plain-shell equivalent that handles
      # auth/refs as safely, so this one stays.
      - name: Checkout code
        uses: actions/checkout@v4

      # ubuntu-latest ships several PHP versions already installed.
      # This just tells the runner which one to use as `php` -
      # no download, no extra action.
      - name: Select PHP 8.2
        run: |
          sudo update-alternatives --set php /usr/bin/php8.2
          php -v
          composer --version

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit --colors=always

  build-and-scan:
    needs: backend-unit-tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker is already installed on the runner - plain `docker build`,
      # no buildx setup action needed.
      - name: Build ${{ matrix.service }} image
        run: |
          docker build -t subscription-reminder-${{ matrix.service }}:${{ github.sha }} ${{ matrix.context }}

      # "Docker image artifact": export the built image to a .tar file.
      - name: Save image as tar
        run: |
          mkdir -p artifacts
          docker save subscription-reminder-${{ matrix.service }}:${{ github.sha }} \
            -o artifacts/${{ matrix.service }}-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-docker-image
          path: artifacts/${{ matrix.service }}-image.tar

      # Download the official Trivy binary directly and verify its
      # checksum before running it - no third-party Action involved.
      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_${TRIVY_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan ${{ matrix.service }} image with Trivy
        run: |
          trivy image \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            subscription-reminder-${{ matrix.service }}:${{ github.sha }} \
            | tee trivy-${{ matrix.service }}-report.txt

      - name: Add Trivy report to job summary
        if: always()
        run: |
          echo "## Trivy scan report — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-${{ matrix.service }}-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-report
          path: trivy-${{ matrix.service }}-report.txt
