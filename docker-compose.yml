version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: subrem_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: subscription_reminder
      POSTGRES_USER: subrem_user
      POSTGRES_PASSWORD: subrem_pass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subrem_user -d subscription_reminder"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: subrem_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: subscription_reminder
      DB_USER: subrem_user
      DB_PASS: subrem_pass
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: subrem_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
